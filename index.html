<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>sensor · room control</title>
<style>
  :root{
    --bg:#eef1f6; --card:#ffffff; --line:#e6eaf1; --inset:#eef1f6;
    --ink:#16202e; --muted:#6a7787; --faint:#9aa6b4;
    --accent:#1683cf; --accent-soft:#e7f2fb;
    --occ:#e08a2b; --ok:#16a765; --bad:#e0524e;
    --shadow:0 1px 2px rgba(20,30,50,.04), 0 10px 30px -18px rgba(20,30,50,.25);
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{
    background:var(--bg); color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    -webkit-font-smoothing:antialiased; min-height:100dvh;
    padding:28px 20px calc(32px + env(safe-area-inset-bottom));
    max-width:430px; margin:0 auto;
    display:flex; flex-direction:column; gap:18px;
  }
 
  header{display:flex; align-items:center; justify-content:space-between; padding:2px 2px 6px}
  .wordmark{font-size:18px; font-weight:680; letter-spacing:-.3px}
  .pill{display:inline-flex; align-items:center; gap:7px; font-size:12.5px; font-weight:550;
        color:var(--muted); background:var(--card); border:1px solid var(--line);
        padding:6px 11px; border-radius:999px; box-shadow:var(--shadow)}
  .pill .dot{width:7px; height:7px; border-radius:50%; background:var(--bad); transition:.25s}
  .pill .dot.on{background:var(--ok)}
 
  .card{background:var(--card); border:1px solid var(--line); border-radius:20px;
        box-shadow:var(--shadow)}
 
  /* hero: AC */
  .hero{padding:24px 22px 22px; position:relative; overflow:hidden}
  .hero .eyebrow{font-size:11px; text-transform:uppercase; letter-spacing:1.3px; color:var(--faint); font-weight:600}
  .hero .state{font-size:34px; font-weight:720; letter-spacing:-.6px; margin-top:10px; line-height:1}
  .hero .state.on{color:var(--accent)}
  .hero .state.off{color:var(--ink)}
  .hero .set{font-size:14px; color:var(--muted); margin-top:8px; font-weight:500}
  .hero .glyph{position:absolute; top:20px; right:22px; width:30px; height:30px; opacity:.18; transition:.3s}
  .hero .glyph.live{opacity:1}
  .hero .glyph path, .hero .glyph line{stroke:var(--accent)}
 
  /* room row */
  .room{display:flex; align-items:center; justify-content:space-between; padding:18px 22px}
  .room .lab{font-size:13px; color:var(--muted)}
  .room .right{display:flex; align-items:center; gap:11px}
  .room .rv{text-align:right}
  .room .rv .m{font-size:16px; font-weight:620}
  .room .rv .s{font-size:12px; color:var(--faint); margin-top:1px}
  .room .ind{width:10px; height:10px; border-radius:50%; background:var(--faint); flex:0 0 auto}
  .room .ind.occ{background:var(--occ)}
 
  /* segmented control */
  .seg-wrap{margin-top:2px}
  .seg-label{font-size:11px; text-transform:uppercase; letter-spacing:1.2px; color:var(--faint);
             font-weight:600; margin:0 0 9px 4px}
  .seg{display:grid; grid-template-columns:repeat(3,1fr); gap:4px;
       background:var(--inset); border:1px solid var(--line); border-radius:14px; padding:4px}
  .seg button{font-family:inherit; font-size:14.5px; font-weight:600; color:var(--muted);
              background:transparent; border:none; border-radius:10px; padding:13px 8px;
              cursor:pointer; transition:.16s ease; -webkit-tap-highlight-color:transparent}
  .seg button:active{transform:scale(.98)}
  .seg button.active{background:var(--accent); color:#fff; box-shadow:0 4px 12px -4px rgba(22,131,207,.55)}
  .seg button:disabled{opacity:.45; cursor:not-allowed}
 
  .connect{width:100%; font-family:inherit; font-size:15px; font-weight:620; color:#fff;
           background:var(--accent); border:none; border-radius:16px; padding:16px;
           cursor:pointer; transition:.16s; box-shadow:0 8px 20px -8px rgba(22,131,207,.6)}
  .connect:active{transform:translateY(1px)}
  .connect.linked{background:var(--card); color:var(--muted); border:1px solid var(--line);
                  box-shadow:var(--shadow)}
 
  .status{font-size:12.5px; color:var(--muted); text-align:center; line-height:1.5; margin:2px 0 0}
  .status:empty{display:none}
</style>
</head>
<body>
  <header>
    <div class="wordmark">sensor</div>
    <div class="pill"><span id="dot" class="dot"></span><span id="connTxt">Offline</span></div>
  </header>
 
  <section class="card hero">
    <div class="eyebrow">Air conditioner</div>
    <div id="acState" class="state off">—</div>
    <div class="set">25°C · Cool</div>
    <svg id="glyph" class="glyph" viewBox="0 0 24 24" fill="none" stroke-width="1.7" stroke-linecap="round">
      <line x1="12" y1="2" x2="12" y2="22"/><line x1="2" y1="12" x2="22" y2="12"/>
      <line x1="4.9" y1="4.9" x2="19.1" y2="19.1"/><line x1="19.1" y1="4.9" x2="4.9" y2="19.1"/>
    </svg>
  </section>
 
  <section class="card room">
    <div class="lab">Room</div>
    <div class="right">
      <div class="rv">
        <div id="roomState" class="m">—</div>
        <div id="roomMeta" class="s">Waiting for sensor</div>
      </div>
      <span id="roomInd" class="ind"></span>
    </div>
  </section>
 
  <div class="seg-wrap">
    <p class="seg-label">Control</p>
    <div class="seg">
      <button data-cmd="AUTO"   disabled>Auto</button>
      <button data-cmd="AC_ON"  disabled>On</button>
      <button data-cmd="AC_OFF" disabled>Off</button>
    </div>
  </div>
 
  <button id="connectBtn" class="connect">Connect</button>
  <p class="status" id="status"></p>
 
<script>
const SERVICE = "7f3e9a20-5c4b-4a1e-9d8f-2b6c1e4a7d90";
const OCC     = "7f3e9a21-5c4b-4a1e-9d8f-2b6c1e4a7d90";
const CMD     = "7f3e9a22-5c4b-4a1e-9d8f-2b6c1e4a7d90";
 
let device, cmdChar;
const $ = id => document.getElementById(id);
const segBtns = Array.from(document.querySelectorAll(".seg button"));
const enc = new TextEncoder();
const dec = new TextDecoder();
const setStatus = t => $("status").textContent = t || "";
 
function setSeg(active){   // active = "AUTO" | "AC_ON" | "AC_OFF" | null
  segBtns.forEach(b => b.classList.toggle("active", b.dataset.cmd === active));
}
 
function setConn(connected){
  $("dot").classList.toggle("on", connected);
  $("connTxt").textContent = connected ? "Connected" : "Offline";
  $("connectBtn").textContent = connected ? "Disconnect" : "Connect";
  $("connectBtn").classList.toggle("linked", connected);
  segBtns.forEach(b => b.disabled = !connected);
  if(!connected){
    $("acState").textContent="—"; $("acState").className="state off";
    $("glyph").classList.remove("live");
    $("roomState").textContent="—"; $("roomMeta").textContent="Waiting for sensor";
    $("roomInd").className="ind";
    setSeg(null);
  }
}
 
function renderRoom(text){
  const [state, nStr] = text.split(",");
  const n = parseInt(nStr || "0", 10);
  const occ = state === "OCCUPIED";
  $("roomState").textContent = occ ? "Occupied" : "Empty";
  $("roomMeta").textContent  = occ ? (n + (n===1 ? " person" : " people")) : "No one detected";
  $("roomInd").className = "ind " + (occ ? "occ" : "");
}
 
function renderAc(jsonText){
  try{
    const d = JSON.parse(jsonText);
    $("acState").textContent = d.acOn ? "On" : "Off";
    $("acState").className = "state " + (d.acOn ? "on" : "off");
    $("glyph").classList.toggle("live", d.acOn);
    const auto = d.mode === "auto";
    setSeg(auto ? "AUTO" : (d.acOn ? "AC_ON" : "AC_OFF"));
  }catch(e){}
}
 
async function connect(){
  try{
    setStatus("Scanning…");
    device = await navigator.bluetooth.requestDevice({
      filters:[{ name:"RoomSensor" }],
      optionalServices:[SERVICE]
    });
    device.addEventListener("gattserverdisconnected", () => { setConn(false); setStatus("Disconnected."); });
    const server  = await device.gatt.connect();
    const service = await server.getPrimaryService(SERVICE);
 
    const occChar = await service.getCharacteristic(OCC);
    await occChar.startNotifications();
    occChar.addEventListener("characteristicvaluechanged", e => renderRoom(dec.decode(e.target.value)));
    try{ renderRoom(dec.decode(await occChar.readValue())); }catch(_){}
 
    cmdChar = await service.getCharacteristic(CMD);
    await cmdChar.startNotifications();
    cmdChar.addEventListener("characteristicvaluechanged", e => renderAc(dec.decode(e.target.value)));
    try{ renderAc(dec.decode(await cmdChar.readValue())); }catch(_){}
 
    setConn(true); setStatus("");
  }catch(err){
    setConn(false);
    setStatus("Couldn't connect — make sure the device is powered and nearby.");
  }
}
 
async function send(cmd){
  if(!cmdChar) return;
  try{ await cmdChar.writeValue(enc.encode(cmd)); }
  catch(err){ setStatus("Command failed. Try reconnecting."); }
}
 
$("connectBtn").addEventListener("click", () => {
  if(device && device.gatt.connected) device.gatt.disconnect();
  else connect();
});
segBtns.forEach(b => b.addEventListener("click", () => send(b.dataset.cmd)));
 
if(!navigator.bluetooth){
  setStatus("This browser has no Web Bluetooth. Use Bluefy on iOS or Chrome on Android.");
  $("connectBtn").disabled = true;
}
</script>
</body>
</html>
