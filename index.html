<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>sensor · room control</title>
<style>
  :root{
    --bg:#0e1620; --panel:#162231; --line:#26384c;
    --ink:#e8eef5; --muted:#7e93a8;
    --ice:#46c6e6;            /* AC / cool */
    --warm:#f2a13c;           /* occupied  */
    --ok:#3ad29f; --bad:#ef5f6b;
    --r:18px;
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{
    background:var(--bg); color:var(--ink); min-height:100dvh;
    font-family:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    padding:24px 18px calc(24px + env(safe-area-inset-bottom));
    display:flex; flex-direction:column; gap:18px; max-width:440px; margin:0 auto;
  }
  header{display:flex; align-items:baseline; justify-content:space-between}
  h1{font-size:20px; letter-spacing:.5px; margin:0; font-weight:700}
  h1 small{color:var(--muted); font-weight:500; letter-spacing:.3px}
  .dot{display:inline-block; width:9px; height:9px; border-radius:50%;
       background:var(--bad); margin-right:7px; vertical-align:middle;
       box-shadow:0 0 0 0 rgba(58,210,159,.6)}
  .dot.on{background:var(--ok); animation:pulse 2s infinite}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(58,210,159,.5)}70%{box-shadow:0 0 0 8px rgba(58,210,159,0)}100%{box-shadow:0 0 0 0 rgba(58,210,159,0)}}
  .conn{font-size:13px; color:var(--muted)}

  .panel{background:var(--panel); border:1px solid var(--line); border-radius:var(--r); padding:20px}
  .label{font-size:12px; text-transform:uppercase; letter-spacing:1.4px; color:var(--muted); margin:0 0 10px}

  /* room state */
  .room{display:flex; align-items:center; gap:16px}
  .room .ring{width:64px; height:64px; border-radius:50%; flex:0 0 auto;
    border:3px solid var(--line); display:grid; place-items:center; transition:.3s}
  .room.occupied .ring{border-color:var(--warm); box-shadow:0 0 24px -6px var(--warm)}
  .room.empty .ring{border-color:var(--line)}
  .room .big{font-size:22px; font-weight:700; line-height:1.1}
  .room .sub{font-size:13px; color:var(--muted); margin-top:3px}
  .room .ring span{font-size:24px}

  /* ac state */
  .ac{display:flex; align-items:center; justify-content:space-between}
  .ac .state{font-size:26px; font-weight:700}
  .ac .state.on{color:var(--ice)}
  .ac .state.off{color:var(--muted)}
  .mode{font-size:12px; padding:5px 11px; border-radius:999px; border:1px solid var(--line); color:var(--muted)}
  .mode.manual{color:var(--warm); border-color:var(--warm)}
  .mode.auto{color:var(--ice); border-color:var(--ice)}

  .controls{display:grid; grid-template-columns:1fr 1fr; gap:12px}
  button{font-family:inherit; font-size:15px; font-weight:600; color:var(--ink);
    background:#1b2a3c; border:1px solid var(--line); border-radius:14px;
    padding:16px 12px; cursor:pointer; transition:.15s; -webkit-tap-highlight-color:transparent}
  button:active{transform:translateY(1px)}
  button:disabled{opacity:.4; cursor:not-allowed}
  button.primary{grid-column:1 / -1; background:var(--ice); color:#06222c; border-color:transparent}
  button.on{border-color:var(--ice); color:var(--ice)}
  button.off{border-color:var(--muted)}
  button.auto{grid-column:1 / -1; border-color:var(--warm); color:var(--warm)}

  .note{font-size:12.5px; color:var(--muted); line-height:1.5; text-align:center}
  .note b{color:var(--ink); font-weight:600}
</style>
</head>
<body>
  <header>
    <h1>sensr <small>· room control</small></h1>
    <div class="conn"><span id="dot" class="dot"></span><span id="connTxt">Not connected</span></div>
  </header>

  <button id="connectBtn" class="primary">Connect to RoomSensor</button>

  <section class="panel">
    <p class="label">Room</p>
    <div id="room" class="room empty">
      <div class="ring"><span id="roomIcon">·</span></div>
      <div>
        <div id="roomState" class="big">—</div>
        <div id="roomSub" class="sub">Waiting for sensor</div>
      </div>
    </div>
  </section>

  <section class="panel">
    <p class="label">Air conditioner</p>
    <div class="ac">
      <div id="acState" class="state off">—</div>
      <div id="modeTag" class="mode auto">auto</div>
    </div>
  </section>

  <section class="panel">
    <p class="label">Override</p>
    <div class="controls">
      <button id="onBtn"   class="on"   disabled>Turn AC on</button>
      <button id="offBtn"  class="off"  disabled>Turn AC off</button>
      <button id="autoBtn" class="auto" disabled>Back to auto</button>
    </div>
  </section>

  <p class="note" id="hint">Open in <b>Bluefy</b> (or any Web Bluetooth browser) and tap connect. Manual on/off holds until you switch back to auto.</p>

<script>
const SERVICE = "7f3e9a20-5c4b-4a1e-9d8f-2b6c1e4a7d90";
const OCC     = "7f3e9a21-5c4b-4a1e-9d8f-2b6c1e4a7d90";
const CMD     = "7f3e9a22-5c4b-4a1e-9d8f-2b6c1e4a7d90";

let device, cmdChar;
const $ = id => document.getElementById(id);
const enc = new TextEncoder();
const dec = new TextDecoder();

function setConn(connected){
  $("dot").classList.toggle("on", connected);
  $("connTxt").textContent = connected ? "Connected" : "Not connected";
  $("connectBtn").textContent = connected ? "Disconnect" : "Connect to RoomSensor";
  ["onBtn","offBtn","autoBtn"].forEach(id => $(id).disabled = !connected);
  if(!connected){
    $("roomState").textContent="—"; $("roomSub").textContent="Waiting for sensor";
    $("room").className="room empty"; $("roomIcon").textContent="·";
    $("acState").textContent="—"; $("acState").className="state off";
  }
}

function renderRoom(text){
  // payload: "OCCUPIED,2" or "EMPTY,0"
  const [state, nStr] = text.split(",");
  const n = parseInt(nStr || "0", 10);
  const occ = state === "OCCUPIED";
  $("room").className = "room " + (occ ? "occupied" : "empty");
  $("roomIcon").textContent = occ ? "●" : "·";
  $("roomState").textContent = occ ? "Occupied" : "Empty";
  $("roomSub").textContent = occ ? (n + (n===1?" person":" people")+" detected") : "No one detected";
}

function renderAc(jsonText){
  // payload: {"acOn":true,"mode":"manual"}
  try{
    const d = JSON.parse(jsonText);
    $("acState").textContent = d.acOn ? "ON" : "OFF";
    $("acState").className = "state " + (d.acOn ? "on" : "off");
    $("modeTag").textContent = d.mode;
    $("modeTag").className = "mode " + (d.mode === "manual" ? "manual" : "auto");
  }catch(e){ /* ignore malformed */ }
}

async function connect(){
  try{
    $("hint").textContent = "Scanning…";
    device = await navigator.bluetooth.requestDevice({
      filters:[{ name:"RoomSensor" }],
      optionalServices:[SERVICE]
    });
    device.addEventListener("gattserverdisconnected", () => setConn(false));
    const server  = await device.gatt.connect();
    const service = await server.getPrimaryService(SERVICE);

    const occChar = await service.getCharacteristic(OCC);
    await occChar.startNotifications();
    occChar.addEventListener("characteristicvaluechanged", e =>
      renderRoom(dec.decode(e.target.value)));
    try{ renderRoom(dec.decode(await occChar.readValue())); }catch(_){}

    cmdChar = await service.getCharacteristic(CMD);
    await cmdChar.startNotifications();
    cmdChar.addEventListener("characteristicvaluechanged", e =>
      renderAc(dec.decode(e.target.value)));
    try{ renderAc(dec.decode(await cmdChar.readValue())); }catch(_){}

    setConn(true);
    $("hint").innerHTML = "Connected. Manual on/off holds until you tap <b>Back to auto</b>.";
  }catch(err){
    $("hint").textContent = "Couldn't connect: " + err.message + ". Make sure the device is powered and nearby.";
    setConn(false);
  }
}

async function send(cmd){
  if(!cmdChar) return;
  try{ await cmdChar.writeValue(enc.encode(cmd)); }
  catch(err){ $("hint").textContent = "Command failed: " + err.message; }
}

$("connectBtn").addEventListener("click", () => {
  if(device && device.gatt.connected){ device.gatt.disconnect(); }
  else { connect(); }
});
$("onBtn").addEventListener("click",   () => send("AC_ON"));
$("offBtn").addEventListener("click",  () => send("AC_OFF"));
$("autoBtn").addEventListener("click", () => send("AUTO"));

if(!navigator.bluetooth){
  $("hint").innerHTML = "This browser has no Web Bluetooth. Open this page in <b>Bluefy</b> on iOS or Chrome on Android/desktop.";
  $("connectBtn").disabled = true;
}
</script>
</body>
</html>
