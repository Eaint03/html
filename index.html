<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>sensor · room control</title>
<style>
  :root{
    --bg:#0f141a; --card:#181f27; --line:#262f3a; --line-soft:#1f2730;
    --ink:#e6ebf0; --muted:#8593a0; --faint:#5b6878;
    --accent:#5096e8;
    --occ:#e0a458; --ok:#43c59e; --bad:#e06070;
    --r:16px;
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{
    background:var(--bg); color:var(--ink); min-height:100dvh;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;
    padding:32px 20px calc(32px + env(safe-area-inset-bottom));
    max-width:420px; margin:0 auto;
    display:flex; flex-direction:column; gap:22px;
  }

  header{display:flex; align-items:center; justify-content:space-between}
  .brand{display:flex; flex-direction:column; gap:3px}
  h1{font-size:19px; font-weight:650; letter-spacing:-.2px; margin:0}
  .brand span{font-size:12px; color:var(--faint); letter-spacing:.4px}
  .conn{display:flex; align-items:center; gap:7px; font-size:12.5px; color:var(--muted)}
  .conn .dot{width:8px; height:8px; border-radius:50%; background:var(--bad); transition:.25s}
  .conn .dot.on{background:var(--ok)}

  button{font-family:inherit; cursor:pointer; transition:.14s ease; -webkit-tap-highlight-color:transparent}
  button:active{transform:translateY(1px)}
  button:disabled{opacity:.38; cursor:not-allowed; transform:none}

  .connect{
    width:100%; font-size:15px; font-weight:600; color:#08243f;
    background:var(--accent); border:none; border-radius:var(--r); padding:15px;
  }
  .connect.linked{background:transparent; color:var(--muted); border:1px solid var(--line)}

  .card{background:var(--card); border:1px solid var(--line); border-radius:var(--r); overflow:hidden}

  .row{display:flex; align-items:center; justify-content:space-between; padding:18px 18px}
  .row + .row{border-top:1px solid var(--line-soft)}
  .row .k{font-size:13px; color:var(--muted)}
  .row .v{display:flex; align-items:center; gap:10px; text-align:right}
  .row .v .main{font-size:16px; font-weight:600}
  .row .v .meta{font-size:12px; color:var(--faint)}

  .pin{width:9px; height:9px; border-radius:50%; background:var(--line); flex:0 0 auto}
  .pin.occ{background:var(--occ)}
  .pin.empty{background:var(--faint)}

  .acval.on{color:var(--accent)}
  .acval.off{color:var(--muted)}
  .tag{font-size:11px; font-weight:600; letter-spacing:.3px; padding:4px 9px; border-radius:999px;
       border:1px solid var(--line); color:var(--muted); text-transform:capitalize}
  .tag.manual{color:var(--occ); border-color:rgba(224,164,88,.4)}
  .tag.auto{color:var(--accent); border-color:rgba(80,150,232,.4)}

  .section-label{font-size:11px; text-transform:uppercase; letter-spacing:1.2px;
                 color:var(--faint); margin:0 0 -8px 4px}

  .grid{display:grid; grid-template-columns:1fr 1fr; gap:10px}
  .ctrl{font-size:14.5px; font-weight:600; color:var(--ink);
        background:var(--card); border:1px solid var(--line); border-radius:13px; padding:15px 12px}
  .ctrl.full{grid-column:1 / -1}
  .ctrl.on:not(:disabled){border-color:rgba(80,150,232,.5)}
  .ctrl.auto:not(:disabled){color:var(--muted)}

  .status{font-size:12.5px; color:var(--muted); text-align:center; line-height:1.5; margin:0}
  .status:empty{display:none}
</style>
</head>
<body>
  <header>
    <div class="brand">
      <h1>sensor</h1>
      <span>Room control</span>
    </div>
    <div class="conn"><span id="dot" class="dot"></span><span id="connTxt">Offline</span></div>
  </header>

  <button id="connectBtn" class="connect">Connect</button>

  <div class="card">
    <div class="row">
      <div class="k">Room</div>
      <div class="v">
        <div>
          <div id="roomState" class="main">—</div>
          <div id="roomMeta" class="meta"></div>
        </div>
        <span id="roomPin" class="pin"></span>
      </div>
    </div>
    <div class="row">
      <div class="k">Air conditioner</div>
      <div class="v">
        <div id="acState" class="main acval off">—</div>
        <span id="modeTag" class="tag auto">auto</span>
      </div>
    </div>
  </div>

  <p class="section-label">Override</p>
  <div class="grid">
    <button id="onBtn"   class="ctrl on"   disabled>Turn on</button>
    <button id="offBtn"  class="ctrl off"  disabled>Turn off</button>
    <button id="autoBtn" class="ctrl auto full" disabled>Back to auto</button>
  </div>

  <p class="status" id="status"></p>

<script>
const SERVICE = "7f3e9a20-5c4b-4a1e-9d8f-2b6c1e4a7d90";
const OCC     = "7f3e9a21-5c4b-4a1e-9d8f-2b6c1e4a7d90";
const CMD     = "7f3e9a22-5c4b-4a1e-9d8f-2b6c1e4a7d90";

let device, cmdChar;
const $ = id => document.getElementById(id);
const enc = new TextEncoder();
const dec = new TextDecoder();
const setStatus = t => $("status").textContent = t || "";

function setConn(connected){
  $("dot").classList.toggle("on", connected);
  $("connTxt").textContent = connected ? "Connected" : "Offline";
  $("connectBtn").textContent = connected ? "Disconnect" : "Connect";
  $("connectBtn").classList.toggle("linked", connected);
  ["onBtn","offBtn","autoBtn"].forEach(id => $(id).disabled = !connected);
  if(!connected){
    $("roomState").textContent="—"; $("roomMeta").textContent="";
    $("roomPin").className="pin";
    $("acState").textContent="—"; $("acState").className="main acval off";
    $("modeTag").textContent="auto"; $("modeTag").className="tag auto";
  }
}

function renderRoom(text){
  const [state, nStr] = text.split(",");
  const n = parseInt(nStr || "0", 10);
  const occ = state === "OCCUPIED";
  $("roomState").textContent = occ ? "Occupied" : "Empty";
  $("roomMeta").textContent  = occ ? (n + (n===1 ? " person" : " people")) : "No one detected";
  $("roomPin").className = "pin " + (occ ? "occ" : "empty");
}

function renderAc(jsonText){
  try{
    const d = JSON.parse(jsonText);
    $("acState").textContent = d.acOn ? "On" : "Off";
    $("acState").className = "main acval " + (d.acOn ? "on" : "off");
    $("modeTag").textContent = d.mode;
    $("modeTag").className = "tag " + (d.mode === "manual" ? "manual" : "auto");
  }catch(e){}
}

async function connect(){
  try{
    setStatus("Scanning…");
    device = await navigator.bluetooth.requestDevice({
      filters:[{ name:"RoomSensor" }],
      optionalServices:[SERVICE]
    });
    device.addEventListener("gattserverdisconnected", () => {
      setConn(false); setStatus("Disconnected.");
    });
    const server  = await device.gatt.connect();
    const service = await server.getPrimaryService(SERVICE);

    const occChar = await service.getCharacteristic(OCC);
    await occChar.startNotifications();
    occChar.addEventListener("characteristicvaluechanged", e => renderRoom(dec.decode(e.target.value)));
    try{ renderRoom(dec.decode(await occChar.readValue())); }catch(_){}

    cmdChar = await service.getCharacteristic(CMD);
    await cmdChar.startNotifications();
    cmdChar.addEventListener("characteristicvaluechanged", e => renderAc(dec.decode(e.target.value)));
    try{ renderAc(dec.decode(await cmdChar.readValue())); }catch(_){}

    setConn(true); setStatus("");
  }catch(err){
    setConn(false);
    setStatus("Couldn't connect — make sure the device is powered and nearby.");
  }
}

async function send(cmd){
  if(!cmdChar) return;
  try{ await cmdChar.writeValue(enc.encode(cmd)); }
  catch(err){ setStatus("Command failed. Try reconnecting."); }
}

$("connectBtn").addEventListener("click", () => {
  if(device && device.gatt.connected) device.gatt.disconnect();
  else connect();
});
$("onBtn").addEventListener("click",   () => send("AC_ON"));
$("offBtn").addEventListener("click",  () => send("AC_OFF"));
$("autoBtn").addEventListener("click", () => send("AUTO"));

if(!navigator.bluetooth){
  setStatus("This browser has no Web Bluetooth. Use Bluefy on iOS or Chrome on Android.");
  $("connectBtn").disabled = true;
}
</script>
</body>
</html>
