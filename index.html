<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#0d9488">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>RoomSensor</title>
<style>
  :root{
    --canvas:#eef1f5;
    --surface:#ffffff;
    --ink:#0f172a;
    --muted:#64748b;
    --faint:#94a3b8;
    --line:#e6eaf0;
    --line-strong:#d3dae3;
    --teal:#0d9488;
    --teal-ink:#0b7c72;
    --teal-soft:#d6f0ec;
    --green:#16a34a;
    --green-soft:#dcfce7;
    --amber:#b45309;
    --amber-soft:#fdf0d5;
    --slate:#475569;
    --slate-soft:#eef2f6;
    --radius:18px;
    --radius-sm:12px;
    --shadow:0 1px 2px rgba(15,23,42,.05), 0 18px 40px -20px rgba(15,23,42,.30);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;}
  body{
    background:var(--canvas);
    color:var(--ink);
    min-height:100dvh;
    display:flex;
    align-items:flex-start;
    justify-content:center;
    padding:30px 18px calc(30px + env(safe-area-inset-bottom));
    -webkit-font-smoothing:antialiased;
    font-feature-settings:"tnum" 1;
  }

  .panel{
    width:100%;
    max-width:412px;
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:var(--radius);
    box-shadow:var(--shadow);
    overflow:hidden;
  }

  /* ── Header ─────────────────────────────────────── */
  .head{
    display:flex;align-items:center;justify-content:space-between;gap:12px;
    padding:18px 20px;
    border-bottom:1px solid var(--line);
  }
  .brand{display:flex;align-items:center;gap:12px;}
  .mark{
    width:36px;height:36px;border-radius:10px;
    background:var(--teal-soft);color:var(--teal-ink);
    display:grid;place-items:center;flex:none;
  }
  .brand h1{font-size:16px;font-weight:600;margin:0;letter-spacing:-.01em;line-height:1.1;}
  .brand p{font-size:11.5px;color:var(--faint);margin:2px 0 0;letter-spacing:.02em;}

  .conn{
    display:inline-flex;align-items:center;gap:7px;white-space:nowrap;
    font-size:12px;font-weight:600;color:var(--muted);
    padding:6px 12px 6px 10px;border-radius:999px;background:var(--slate-soft);
  }
  .conn .dot{width:8px;height:8px;border-radius:50%;background:var(--faint);flex:none;}
  .conn[data-state="connected"]{color:var(--green);background:var(--green-soft);}
  .conn[data-state="connected"] .dot{background:var(--green);animation:pulse 2.2s infinite;}
  .conn[data-state="connecting"]{color:var(--amber);background:var(--amber-soft);}
  .conn[data-state="connecting"] .dot{background:var(--amber);}
  @keyframes pulse{
    0%{box-shadow:0 0 0 0 rgba(22,163,74,.45);}
    70%{box-shadow:0 0 0 6px rgba(22,163,74,0);}
    100%{box-shadow:0 0 0 0 rgba(22,163,74,0);}
  }

  /* ── Room status (single hero) ─────────────────── */
  .status-card{
    padding:34px 20px 32px;
    text-align:center;
    border-bottom:1px solid var(--line);
  }
  .eyebrow{font-size:10.5px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--faint);margin:0 0 14px;}
  .room-val{
    font-size:34px;font-weight:600;letter-spacing:-.02em;line-height:1;
    display:inline-flex;align-items:center;gap:13px;
    color:var(--faint);transition:color .3s ease;
  }
  .swatch{width:12px;height:12px;border-radius:50%;background:var(--line-strong);flex:none;transition:background .3s ease,opacity .3s ease;}
  .room-sub{margin:12px 0 0;font-size:13.5px;color:var(--muted);min-height:1.1em;}

  .status-card[data-on="null"]  .room-val{color:var(--faint);}
  .status-card[data-on="null"]  .swatch{opacity:.55;}
  .status-card[data-on="false"] .room-val{color:var(--slate);}
  .status-card[data-on="true"]  .room-val{color:var(--ink);}
  .status-card[data-on="true"]  .swatch{background:var(--green);}

  /* ── Action ────────────────────────────────────── */
  .controls{padding:16px 20px 20px;display:grid;gap:10px;}
  .btn{
    appearance:none;border:1px solid var(--line-strong);background:var(--surface);color:var(--ink);
    font:inherit;font-weight:600;font-size:15px;padding:13px 16px;border-radius:var(--radius-sm);
    cursor:pointer;display:flex;align-items:center;justify-content:center;gap:9px;
    transition:transform .04s ease,background .15s ease,border-color .15s ease,color .15s ease,opacity .15s ease;
    -webkit-tap-highlight-color:transparent;
  }
  .btn:active{transform:scale(.985);}
  .btn:focus-visible{outline:2px solid var(--teal);outline-offset:2px;}
  .btn[disabled]{opacity:.45;cursor:not-allowed;}
  .btn-primary{background:var(--teal);border-color:var(--teal);color:#fff;}
  .btn-primary:hover{background:var(--teal-ink);border-color:var(--teal-ink);}

  .hint{font-size:12.5px;color:var(--muted);text-align:center;line-height:1.5;margin:3px 4px 0;}

  /* ── Activity ──────────────────────────────────── */
  .log{
    display:flex;align-items:center;justify-content:space-between;gap:10px;
    border-top:1px solid var(--line);padding:11px 20px 13px;
    font-size:11.5px;color:var(--faint);
  }
  .log .msg{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .log .time{font-variant-numeric:tabular-nums;flex:none;}

  @media (prefers-reduced-motion:reduce){
    *{animation:none !important;transition:none !important;}
  }
</style>
</head>
<body>
  <main class="panel" role="application" aria-label="RoomSensor occupancy monitor">
    <header class="head">
      <div class="brand">
        <div class="mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
            <circle cx="12" cy="12" r="1.5" fill="currentColor" stroke="none"/>
            <path d="M8.6 15.4a5 5 0 0 1 0-6.8"/>
            <path d="M15.4 8.6a5 5 0 0 1 0 6.8"/>
            <path d="M6 18a9 9 0 0 1 0-12"/>
            <path d="M18 6a9 9 0 0 1 0 12"/>
          </svg>
        </div>
        <div>
          <h1>RoomSensor</h1>
          <p>Occupancy monitor</p>
        </div>
      </div>
      <span class="conn" id="conn" data-state="disconnected" role="status" aria-live="polite">
        <span class="dot"></span><span id="connText">Disconnected</span>
      </span>
    </header>

    <section class="status-card" id="roomCard" data-on="null">
      <p class="eyebrow">Room</p>
      <div class="room-val"><span class="swatch"></span><span id="roomVal">—</span></div>
      <p class="room-sub" id="roomSub"></p>
    </section>

    <section class="controls">
      <button class="btn btn-primary" id="connectBtn" type="button">Connect</button>
      <p class="hint" id="hint">Connect to your RoomSensor to see live room status.</p>
    </section>

    <footer class="log">
      <span class="msg" id="logMsg">Ready</span>
      <span class="time" id="logTime">—</span>
    </footer>
  </main>

<script>
  // BLE contract — must match the sensor-only firmware
  const SERVICE_UUID = '12345678-1234-1234-1234-123456789abc';
  const STATUS_UUID  = '12345678-1234-1234-1234-123456789ab1'; // notify → phone

  const $ = (id) => document.getElementById(id);
  const conn = $('conn'), connText = $('connText');
  const roomCard = $('roomCard'), roomVal = $('roomVal'), roomSub = $('roomSub');
  const connectBtn = $('connectBtn'), hint = $('hint');
  const logMsg = $('logMsg'), logTime = $('logTime');

  let device = null, server = null;

  function log(msg){
    logMsg.textContent = msg;
    logTime.textContent = new Date().toLocaleTimeString([], {hour:'2-digit', minute:'2-digit', second:'2-digit'});
  }
  function setConn(state, text){ conn.dataset.state = state; connText.textContent = text; }
  function clearStatus(){
    roomCard.dataset.on = 'null';
    roomVal.textContent = '—';
    roomSub.textContent = '';
  }

  // Guard: no Web Bluetooth (e.g. Safari, or a sandboxed preview)
  if(!('bluetooth' in navigator)){
    connectBtn.disabled = true;
    hint.textContent = 'This browser can’t use Bluetooth. Open this page in Bluefy on iPhone, or Chrome on Android.';
    log('Web Bluetooth unavailable');
  }

  connectBtn.addEventListener('click', () => {
    if(server && server.connected){ disconnect(); } else { connect(); }
  });

  async function connect(){
    try{
      setConn('connecting', 'Connecting…');
      log('Scanning for RoomSensor');
      device = await navigator.bluetooth.requestDevice({
        filters: [{ services: [SERVICE_UUID] }, { name: 'RoomSensor' }],
        optionalServices: [SERVICE_UUID]
      });
      device.addEventListener('gattserverdisconnected', onDisconnected);

      server = await device.gatt.connect();
      const service = await server.getPrimaryService(SERVICE_UUID);

      const statusChar = await service.getCharacteristic(STATUS_UUID);
      await statusChar.startNotifications();
      statusChar.addEventListener('characteristicvaluechanged', onStatus);

      setConn('connected', 'Connected');
      connectBtn.textContent = 'Disconnect';
      connectBtn.classList.remove('btn-primary');
      hint.textContent = 'Live. Watching the room for presence.';
      log('Connected to ' + (device.name || 'RoomSensor'));
    }catch(e){
      setConn('disconnected', 'Disconnected');
      if(e && e.name === 'NotFoundError'){
        log('No device selected');
      }else{
        log('Connect failed: ' + ((e && e.message) || e));
        hint.textContent = 'Couldn’t connect. Make sure the ESP32 is powered and advertising as RoomSensor.';
      }
    }
  }

  function disconnect(){
    if(device && device.gatt && device.gatt.connected) device.gatt.disconnect();
  }

  function onDisconnected(){
    setConn('disconnected', 'Disconnected');
    connectBtn.textContent = 'Connect';
    connectBtn.classList.add('btn-primary');
    clearStatus();
    hint.textContent = 'Disconnected. Tap Connect to reconnect.';
    log('Disconnected');
    server = null;
  }

  function onStatus(event){
    let d;
    try{ d = JSON.parse(new TextDecoder().decode(event.target.value)); }
    catch{ log('Unreadable status frame'); return; }

    if(typeof d.occupied === 'boolean'){
      roomCard.dataset.on = String(d.occupied);
      roomVal.textContent = d.occupied ? 'Occupied' : 'Empty';
      if(d.occupied){
        const n = Number(d.persons) || 0;
        roomSub.textContent = n > 0 ? (n + (n === 1 ? ' person' : ' people')) : 'Presence detected';
      }else{
        roomSub.textContent = 'No presence detected';
      }
    }
    log('Status updated');
  }
</script>
</body>
</html>
