<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RoomSensor Control</title>
<style>
  body { font-family: sans-serif; max-width: 400px; margin: 40px auto; padding: 0 20px; background: #111; color: #eee; }
  h1 { font-size: 20px; margin-bottom: 24px; }
  #status-box { background: #222; border-radius: 12px; padding: 20px; margin-bottom: 20px; }
  .label { font-size: 13px; color: #888; margin-bottom: 4px; }
  .value { font-size: 28px; font-weight: 500; margin-bottom: 16px; }
  .occupied { color: #4ade80; }
  .empty    { color: #60a5fa; }
  .ac-on    { color: #f97316; }
  .ac-off   { color: #94a3b8; }
  button { width: 100%; padding: 14px; border-radius: 10px; border: none; font-size: 16px; margin-bottom: 12px; cursor: pointer; }
  #btn-connect  { background: #3b82f6; color: white; }
  #btn-ac-on    { background: #f97316; color: white; }
  #btn-ac-off   { background: #374151; color: white; }
  #btn-auto     { background: #1f2937; color: #9ca3af; border: 1px solid #374151; }
  #log { font-size: 12px; color: #4b5563; margin-top: 20px; white-space: pre-wrap; }
  .mode-badge { display: inline-block; font-size: 12px; padding: 3px 10px; border-radius: 20px; background: #1f2937; color: #9ca3af; margin-left: 8px; vertical-align: middle; }
</style>
</head>
<body>
<h1>RoomSensor <span class="mode-badge" id="mode-badge">disconnected</span></h1>

<div id="status-box">
  <div class="label">Room</div>
  <div class="value" id="room-val">—</div>
  <div class="label">AC</div>
  <div class="value" id="ac-val">—</div>
</div>

<button id="btn-connect" onclick="connectBLE()">Connect to RoomSensor</button>
<button id="btn-ac-on"  onclick="sendCmd('AC_ON')"  disabled>Force AC ON</button>
<button id="btn-ac-off" onclick="sendCmd('AC_OFF')" disabled>Force AC OFF</button>
<button id="btn-auto"   onclick="sendCmd('AUTO')"   disabled>Return to AUTO</button>

<div id="log"></div>

<script>
const SERVICE  = '12345678-1234-1234-1234-123456789abc';
const STATUS   = '12345678-1234-1234-1234-123456789ab1';
const COMMAND  = '12345678-1234-1234-1234-123456789ab2';

let cmdChar = null;

function log(msg) {
  const el = document.getElementById('log');
  el.textContent = new Date().toLocaleTimeString() + '  ' + msg + '\n' + el.textContent;
}

async function connectBLE() {
  try {
    log('Scanning...');
    const device = await navigator.bluetooth.requestDevice({
      filters: [{ name: 'RoomSensor' }],
      optionalServices: [SERVICE]
    });
    log('Found: ' + device.name);
    const server  = await device.gatt.connect();
    const service = await server.getPrimaryService(SERVICE);

    const statusChar = await service.getCharacteristic(STATUS);
    cmdChar = await service.getCharacteristic(COMMAND);

    await statusChar.startNotifications();
    statusChar.addEventListener('characteristicvaluechanged', onStatus);

    document.getElementById('btn-ac-on').disabled  = false;
    document.getElementById('btn-ac-off').disabled = false;
    document.getElementById('btn-auto').disabled   = false;
    document.getElementById('btn-connect').textContent = 'Connected';
    document.getElementById('btn-connect').style.background = '#166534';
    log('Connected — waiting for status...');
  } catch(e) {
    log('Error: ' + e.message);
  }
}

function onStatus(e) {
  const text = new TextDecoder().decode(e.target.value);
  log('Status: ' + text);
  try {
    const d = JSON.parse(text);
    const roomEl = document.getElementById('room-val');
    const acEl   = document.getElementById('ac-val');
    const badge  = document.getElementById('mode-badge');
    roomEl.textContent = d.occupied ? 'OCCUPIED' : 'EMPTY';
    roomEl.className   = 'value ' + (d.occupied ? 'occupied' : 'empty');
    acEl.textContent   = d.acOn ? 'ON' : 'OFF';
    acEl.className     = 'value ' + (d.acOn ? 'ac-on' : 'ac-off');
    badge.textContent  = d.mode || 'auto';
  } catch(e) {}
}

async function sendCmd(cmd) {
  if (!cmdChar) { log('Not connected'); return; }
  try {
    await cmdChar.writeValue(new TextEncoder().encode(cmd));
    log('Sent: ' + cmd);
  } catch(e) {
    log('Send error: ' + e.message);
  }
}
</script>
</body>
</html>
